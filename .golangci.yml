version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - errorlint
    - revive
    - gocritic
    - bodyclose
    - nolintlint
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      rules:
        - name: exported
        - name: context-as-argument
    depguard:
      rules:
        banned:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard library errors package
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: github.com/stretchr/testify
              desc: use stdlib testing and go-cmp
    forbidigo:
      # Match on resolved types, so `import l "log"` and `import f "fmt"` are caught.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print
          msg: write to an injected io.Writer; stdout belongs to the child process
        - pattern: ^print$
        - pattern: ^println$
        - pattern: ^log\.
          msg: use log/slog on stderr
        - pattern: ^os\.(Stdout|Stderr)$
          msg: write to an injected io.Writer; only cmd/ and internal/cli touch the process streams
        - pattern: ^panic$
          msg: return an error; panic is allowed only in cmd/ and internal/cli
  exclusions:
    rules:
      - path: ^(internal/cli|cmd|acceptance)/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dscafati/secretref
