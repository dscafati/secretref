name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Full history: adr-check compares the decision records with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check
        env:
          ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check

  build-all:
    name: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cross-compile every release target with CGO_ENABLED=0
        run: make build-all

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # make test-integration runs the keyring test on a private session bus
      # with a throwaway gnome-keyring when these are installed.
      - name: Install a Secret Service for the keyring test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus
      - name: Integration tests
        env:
          # Fail instead of skipping if the throwaway keyring is not reachable.
          SECRETREF_REQUIRE_KEYRING: "1"
        run: make test-integration CONTAINER=docker

  commit-trailers:
    name: commit-trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same script as the lefthook commit-msg hook and the Claude Code hook.
      - name: Reject AI co-author and session trailers
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          status=0
          for sha in $(git rev-list "$range"); do
            if ! git log -n 1 --format=%B "$sha" | sh scripts/check-commit-msg.sh - 2>/dev/null; then
              echo "::error::Commit $sha has an AI co-author or Claude-Session trailer"
              status=1
            fi
          done
          exit "$status"

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fuzz every parser target for 30 seconds
        run: make fuzz FUZZTIME=30s
      # A failing input is written under testdata/fuzz; print it so it can be
      # added to the committed corpus. Fuzz inputs are random, not secrets.
      - name: Show failing fuzz inputs
        if: failure()
        run: |
          git status --porcelain --untracked-files=all -- 'internal/*/testdata/fuzz' |
            awk '{print $2}' | while read -r f; do echo "== $f"; cat "$f"; done

  ci-gate:
    name: ci-gate
    if: always()
    needs: [check, build-all, integration, commit-trailers, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_ALL_RESULT: ${{ needs.build-all.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          TRAILERS_RESULT: ${{ needs.commit-trailers.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "check=$CHECK_RESULT build-all=$BUILD_ALL_RESULT integration=$INTEGRATION_RESULT commit-trailers=$TRAILERS_RESULT fuzz=$FUZZ_RESULT"
          [ "$CHECK_RESULT" = "success" ] && [ "$BUILD_ALL_RESULT" = "success" ] && [ "$INTEGRATION_RESULT" = "success" ] && [ "$TRAILERS_RESULT" = "success" ] && [ "$FUZZ_RESULT" = "success" ]
