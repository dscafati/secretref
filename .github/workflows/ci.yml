name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check
        run: make check

  build-all:
    name: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cross-compile every release target with CGO_ENABLED=0
        run: make build-all

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # make test-integration runs the keyring test on a private session bus
      # with a throwaway gnome-keyring when these are installed.
      - name: Install a Secret Service for the keyring test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus
      - name: Integration tests
        env:
          # Fail instead of skipping if the throwaway keyring is not reachable.
          SECRETREF_REQUIRE_KEYRING: "1"
        run: make test-integration CONTAINER=docker

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fuzz every parser target for 30 seconds
        run: make fuzz FUZZTIME=30s
      # A failing input is written under testdata/fuzz; print it so it can be
      # added to the committed corpus. Fuzz inputs are random, not secrets.
      - name: Show failing fuzz inputs
        if: failure()
        run: |
          git status --porcelain --untracked-files=all -- 'internal/*/testdata/fuzz' |
            awk '{print $2}' | while read -r f; do echo "== $f"; cat "$f"; done

  ci-gate:
    name: ci-gate
    if: always()
    needs: [check, build-all, integration, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_ALL_RESULT: ${{ needs.build-all.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "check=$CHECK_RESULT build-all=$BUILD_ALL_RESULT integration=$INTEGRATION_RESULT fuzz=$FUZZ_RESULT"
          [ "$CHECK_RESULT" = "success" ] && [ "$BUILD_ALL_RESULT" = "success" ] && [ "$INTEGRATION_RESULT" = "success" ] && [ "$FUZZ_RESULT" = "success" ]
