name: release

on:
  push:
    tags: ["v*"]
  # A manual run is always a dry run: the dry-run job below has no environment,
  # no secrets and no id-token, so branch code run from here cannot publish.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Manual runs only. No environment, no secrets, no id-token, read-only token.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing cannot create packages and needs npm 11.5.1 or
      # later. Stop before GoReleaser publishes anything if an npm package has
      # not been bootstrapped or Node's bundled npm is too old.
      - name: Check npm packages exist
        run: scripts/npm-publish.sh preflight
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Not a secret: GoReleaser templates the tap token, so it needs a value.
      # Signing needs an id-token and is skipped; the tag run signs.
      - name: GoReleaser snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: dry-run-placeholder
        run: go tool -modfile=tools/go.mod goreleaser release --clean --snapshot --skip=publish,sign
      - name: npm publish --dry-run
        run: scripts/npm-publish.sh

  # Tag pushes only. The release environment holds TAP_GITHUB_TOKEN and is
  # restricted to v* tags (docs/releasing.md).
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DRY_RUN: "false"
      # Homebrew, Scoop and winget are published by hand for now
      # (docs/releasing.md). Set to "true" to let GoReleaser push them; that
      # needs TAP_GITHUB_TOKEN in the release environment.
      PUBLISH_PACKAGE_MANAGERS: "false"
    steps:
      # Without the token GoReleaser falls back to GITHUB_TOKEN, which cannot
      # push to other repositories, and fails after the GitHub release is
      # already public. Stop here instead, before anything is published.
      - name: Check tap token
        if: env.PUBLISH_PACKAGE_MANAGERS == 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::PUBLISH_PACKAGE_MANAGERS is true but the release environment has no TAP_GITHUB_TOKEN secret"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing cannot create packages and needs npm 11.5.1 or
      # later. Stop before GoReleaser publishes anything if an npm package has
      # not been bootstrapped or Node's bundled npm is too old.
      - name: Check npm packages exist
        run: scripts/npm-publish.sh preflight
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: go tool -modfile=tools/go.mod goreleaser release --clean
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
            dist/*.sbom.json
            dist/secretref_*/secretref
            dist/secretref_*/secretref.exe
      # For publishing to Homebrew, Scoop and winget by hand (docs/releasing.md).
      - name: Upload package-manager manifests
        if: env.PUBLISH_PACKAGE_MANAGERS != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manager-manifests
          path: |
            dist/homebrew/
            dist/scoop/
            dist/winget/
          if-no-files-found: error
      - name: Publish npm packages
        run: scripts/npm-publish.sh
